# =====================================================================================
# Secret scan.
#
# A backstop, not the control. The control is that secrets are supplied by the platform's
# secret store and `.env` is git-ignored; this exists because "we are careful" is not a
# property, and because a committed secret is a ROTATED secret rather than a deleted one —
# by the time anybody notices, the fix is no longer `git rm`.
#
# It runs on pull requests and on pushes to main. `fetch-depth: 0` because a secret that
# was added and removed within the branch is still in the history being merged.
# =====================================================================================
name: secrets

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan history for credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
